name: Test and package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-storage:
    name: macOS storage adapter
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test native storage adapter
        run: dotnet test Lightflow.Platform.MacOS.Tests/Lightflow.Platform.MacOS.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=mac-storage.trx"
      - name: Exercise production adapter through standalone host
        run: dotnet run --project tools/MacStorageHost/MacStorageHost.csproj -c Release -p:RestoreLockedMode=true -- --data-root "$RUNNER_TEMP/lf006-storage-fixtures"
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mac-storage-evidence
          path: |
            Lightflow.Platform.MacOS.Tests/TestResults/*.trx
            ${{ runner.temp }}/lf006-storage-fixtures/results.json
          if-no-files-found: error
          retention-days: 14

  neutral:
    name: Neutral classification (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test shared classification and storage contracts without Windows targeting packs
        run: dotnet test Lightflow.Application.Tests/Lightflow.Application.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=neutral.trx"
      - name: Preserve neutral results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neutral-classification-${{ matrix.os }}
          path: Lightflow.Application.Tests/TestResults/*.trx
          if-no-files-found: error
          retention-days: 14

  test:
    name: Unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Cache pinned FFmpeg dependencies
        uses: actions/cache@v5
        with:
          # Cache only the immutable archives. Each job re-verifies SHA-256 and
          # extracts fresh contents rather than trusting cached extracted files.
          path: .cache/ffmpeg/*.zip
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('dependencies/ffmpeg.json', 'dependencies/ffmpeg-playback.json') }}
      - name: Restore
        run: dotnet restore .\LightflowStudio.Tests\LightflowStudio.Tests.csproj
      - name: Prepare verified FFmpeg dependencies
        shell: pwsh
        run: |
          .\scripts\Get-Ffmpeg.ps1
          .\scripts\Get-PlaybackDependencies.ps1
      - name: Test
        run: .\scripts\Test-Noninteractive.ps1 -NoRestore
      - name: Test Premiere companion reconciliation
        run: node --test PremiereCompanion/*.test.cjs
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error
          retention-days: 14

      - name: Prepare sanitized failure logs
        if: failure()
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci-failure-logs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem artifacts/validation -Filter output.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $text = Get-Content -LiteralPath $_.FullName -Raw
            foreach ($root in @($env:GITHUB_WORKSPACE, $env:USERPROFILE, $env:TEMP)) {
              if ($root) { $text = $text.Replace($root, '[CI-owned-root]') }
            }
            Set-Content -LiteralPath (Join-Path $destination ($_.Directory.Name + '.log')) -Value $text
          }
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-failure-diagnostics
          path: |
            **/TestResults/**/*.dmp
            **/TestResults/**/Sequence*.xml
            artifacts/ci-failure-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Windows installer and portable package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Cache pinned FFmpeg dependencies
        uses: actions/cache@v5
        with:
          # Cache only the immutable archives. Each job re-verifies SHA-256 and
          # extracts fresh contents rather than trusting cached extracted files.
          path: .cache/ffmpeg/*.zip
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('dependencies/ffmpeg.json', 'dependencies/ffmpeg-playback.json') }}
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build verified release artifacts
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "" }
          $mode = if ($env:GITHUB_REF_TYPE -eq "tag") { "Release" } else { "PullRequest" }
          .\scripts\Build-Release.ps1 -Version $version -Mode $mode
      - name: Upload validated Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lightflow-studio-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lightflow-studio-windows
          path: dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Lightflow Studio ${{ github.ref_name }}"
