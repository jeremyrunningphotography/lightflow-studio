name: Test and package

on:
  pull_request:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test CI routing
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - id: classify
        run: python3 scripts/ci/docs_ci.py

  docs:
    name: Documentation validation
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 scripts/ci/docs_ci.py --validate

  mac-storage:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.docs_only != 'true'
    name: macOS storage and Catalog lifecycle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test native storage adapter
        run: dotnet test Lightflow.Platform.MacOS.Tests/Lightflow.Platform.MacOS.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=mac-storage.trx"
      - name: Exercise production adapter through standalone host
        run: dotnet run --project tools/MacStorageHost/MacStorageHost.csproj -c Release -p:RestoreLockedMode=true -- --data-root "$RUNNER_TEMP/lf006-storage-fixtures"
      - name: Build native Catalog lifecycle host
        run: dotnet build tools/MacCatalogHost/MacCatalogHost.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true
      - name: Qualify independent Catalog processes
        run: python3 tools/MacCatalogHost/qualification/lifecycle.py --dotnet "$(command -v dotnet)" --host "$PWD/tools/MacCatalogHost/bin/Release/net8.0/MacCatalogHost.dll" --data-root "$RUNNER_TEMP/lf015-catalog-fixtures"
      - name: Build self-contained Mac application shell
        run: scripts/Build-MacShell.sh
      - name: Archive unsigned development app
        run: tar -czf artifacts/mac-shell/LightflowStudio-Mac-development.tar.gz -C artifacts/mac-shell 'Lightflow Studio.app' provenance.json
      - name: Preserve Mac development app
        uses: actions/upload-artifact@v6
        with:
          name: lightflow-studio-mac-development
          path: artifacts/mac-shell/LightflowStudio-Mac-development.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mac-storage-evidence
          path: |
            Lightflow.Platform.MacOS.Tests/TestResults/*.trx
            ${{ runner.temp }}/lf006-storage-fixtures/results.json
            ${{ runner.temp }}/lf015-catalog-fixtures/qualification.jsonl
            ${{ runner.temp }}/lf015-catalog-fixtures/summary.json
          if-no-files-found: error
          retention-days: 14

  neutral-windows:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.docs_only != 'true'
    name: Neutral classification (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test shared classification and storage contracts without Windows targeting packs
        run: dotnet test Lightflow.Application.Tests/Lightflow.Application.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=neutral.trx"
      - name: Test shared production Catalog without Windows targeting packs
        run: dotnet test Lightflow.Catalog.Tests/Lightflow.Catalog.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=neutral-catalog.trx"
      - name: Test shared Avalonia shell presentation
        run: dotnet test Lightflow.UI.Tests/Lightflow.UI.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=shell-ui.trx"
      - name: Preserve neutral results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neutral-classification-windows-latest
          path: |
            Lightflow.Application.Tests/TestResults/*.trx
            Lightflow.Catalog.Tests/TestResults/*.trx
            Lightflow.UI.Tests/TestResults/*.trx
          if-no-files-found: error
          retention-days: 14

  neutral-macos:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.docs_only != 'true'
    name: Neutral classification (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test shared classification and storage contracts without Windows targeting packs
        run: dotnet test Lightflow.Application.Tests/Lightflow.Application.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=neutral.trx"
      - name: Test shared production Catalog without Windows targeting packs
        run: dotnet test Lightflow.Catalog.Tests/Lightflow.Catalog.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=neutral-catalog.trx"
      - name: Test shared Avalonia shell presentation
        run: dotnet test Lightflow.UI.Tests/Lightflow.UI.Tests.csproj -c Release --disable-build-servers -p:RestoreLockedMode=true --logger "trx;LogFileName=shell-ui.trx"
      - name: Preserve neutral results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: neutral-classification-macos-latest
          path: |
            Lightflow.Application.Tests/TestResults/*.trx
            Lightflow.Catalog.Tests/TestResults/*.trx
            Lightflow.UI.Tests/TestResults/*.trx
          if-no-files-found: error
          retention-days: 14

  test:
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.docs_only != 'true'
    name: Windows application tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Cache pinned FFmpeg dependencies
        uses: actions/cache@v5
        with:
          # Cache only the immutable archives. Each job re-verifies SHA-256 and
          # extracts fresh contents rather than trusting cached extracted files.
          path: .cache/ffmpeg/*.zip
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('dependencies/ffmpeg.json', 'dependencies/ffmpeg-playback.json') }}
      - name: Restore
        run: dotnet restore .\LightflowStudio.Tests\LightflowStudio.Tests.csproj
      - name: Prepare verified FFmpeg dependencies
        shell: pwsh
        run: |
          .\scripts\Get-Ffmpeg.ps1
          .\scripts\Get-PlaybackDependencies.ps1
      - name: Test
        run: .\scripts\Test-Noninteractive.ps1 -NoRestore
      - name: Test Premiere companion reconciliation
        run: node --test PremiereCompanion/*.test.cjs
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error
          retention-days: 14

      - name: Prepare sanitized failure logs
        if: failure()
        shell: pwsh
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE 'artifacts/ci-failure-logs'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Get-ChildItem artifacts/validation -Filter output.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            $text = Get-Content -LiteralPath $_.FullName -Raw
            foreach ($root in @($env:GITHUB_WORKSPACE, $env:USERPROFILE, $env:TEMP)) {
              if ($root) { $text = $text.Replace($root, '[CI-owned-root]') }
            }
            Set-Content -LiteralPath (Join-Path $destination ($_.Directory.Name + '.log')) -Value $text
          }
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-failure-diagnostics
          path: |
            **/TestResults/**/*.dmp
            **/TestResults/**/Sequence*.xml
            artifacts/ci-failure-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  full-package:
    name: Build Windows installer and portable package
    needs: test
    # Override transitive skip propagation from the docs/full branches.
    if: always() && !cancelled() && needs.test.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Cache pinned FFmpeg dependencies
        uses: actions/cache@v5
        with:
          # Cache only the immutable archives. Each job re-verifies SHA-256 and
          # extracts fresh contents rather than trusting cached extracted files.
          path: .cache/ffmpeg/*.zip
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('dependencies/ffmpeg.json', 'dependencies/ffmpeg-playback.json') }}
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build verified release artifacts
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "" }
          $mode = if ($env:GITHUB_REF_TYPE -eq "tag") { "Release" } else { "PullRequest" }
          .\scripts\Build-Release.ps1 -Version $version -Mode $mode
      - name: Upload validated Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lightflow-studio-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # Stable protection contexts: a docs pass is required; a skipped/failed
  # classifier never grants the lightweight path. Each platform has its own
  # result, so an unsuccessful required platform cannot be hidden by another.
  unit-tests:
    name: Unit tests
    needs: [changes, docs, test, full-package, mac-storage, neutral-windows, neutral-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected validation succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          NATIVE_RESULT: ${{ needs.mac-storage.result }}
          NEUTRAL_WINDOWS_RESULT: ${{ needs.neutral-windows.result }}
          NEUTRAL_MACOS_RESULT: ${{ needs.neutral-macos.result }}
          FULL_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.full-package.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS_RESULT" = success
            test "$FULL_RESULT" = skipped
            test "$PACKAGE_RESULT" = skipped
            test "$NATIVE_RESULT" = skipped
            test "$NEUTRAL_WINDOWS_RESULT" = skipped
            test "$NEUTRAL_MACOS_RESULT" = skipped
          else
            test "$FULL_RESULT" = success
            test "$PACKAGE_RESULT" = success
            test "$NATIVE_RESULT" = success
            test "$NEUTRAL_WINDOWS_RESULT" = success
            test "$NEUTRAL_MACOS_RESULT" = success
          fi

  package:
    name: Windows installer and portable package
    needs: [changes, docs, full-package, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected package validation succeeded
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FULL_RESULT: ${{ needs.full-package.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$CHANGES_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS_RESULT" = success
            test "$FULL_RESULT" = skipped
          else
            test "$FULL_RESULT" = success
          fi

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && always() && !cancelled() && needs.package.result == 'success'
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lightflow-studio-windows
          path: dist
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Lightflow Studio ${{ github.ref_name }}"
